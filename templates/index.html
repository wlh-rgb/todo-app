<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>待办事项</title>
</head>
<body>
    <h1>待办事项</h1>

    <form action="/add" method="post">
        <label for="task-input">任务内容</label>
        <input type="text" id="task-input" name="title" placeholder="输入任务...">
        <button type="submit">添加</button>
    </form>

    <ul>
        {% for task in tasks %}
        <li>{{ task.title }}</li>
        {% endfor %}
    </ul>
</body>
</html>
